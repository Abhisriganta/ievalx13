server {
    listen 80;

    # ── Gzip compression ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml
        text/javascript
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    # ── Auth (ms-auth :8001) ──
    location /api/auth/       { proxy_pass http://ms-auth:8001; }
    location /api/storage/    { proxy_pass http://ms-auth:8001; }

    # ── Employer (ms-employer :8002) ──
    location /api/companies/  { proxy_pass http://ms-employer:8002; }
    location /api/company/    { proxy_pass http://ms-employer:8002; }
    location /api/employer/   { proxy_pass http://ms-employer:8002; }
    location /api/employers/  { proxy_pass http://ms-employer:8002; }
    location /api/employee/   { proxy_pass http://ms-employer:8002; }
    location /api/company-post/ { proxy_pass http://ms-employer:8002; }
    location /api/recruiter/  { proxy_pass http://ms-employer:8002; }
    location /api/talent-pool/ { proxy_pass http://ms-employer:8002; }
    location /api/activity-log/ { proxy_pass http://ms-employer:8002; }
    location /api/outreach/   { proxy_pass http://ms-employer:8002; }

    # ── Jobseeker (ms-jobseeker :8003) ──
    location /api/jobseeker/  { proxy_pass http://ms-jobseeker:8003; }
    location /api/job-seeker/ { proxy_pass http://ms-jobseeker:8003; }
    location /api/jobseekers/ { proxy_pass http://ms-jobseeker:8003; }
    location /api/resume-builder/ { proxy_pass http://ms-jobseeker:8003; }
    location /api/resume/     { proxy_pass http://ms-jobseeker:8003; }
    location /api/feed/       { proxy_pass http://ms-jobseeker:8003; }
    location /api/quick-interview/ { proxy_pass http://ms-jobseeker:8003; }
    location /api/real-time-interview/ { proxy_pass http://ms-jobseeker:8003; }
    location /api/analytics/  { proxy_pass http://ms-jobseeker:8003; }

    # ── Jobs (ms-jobs :8004) ──
    location /api/jobs/       { proxy_pass http://ms-jobs:8004; }
    location /api/job-post/   { proxy_pass http://ms-jobs:8004; }
    location /api/job-application/ { proxy_pass http://ms-jobs:8004; }
    location /api/job-benefit/ { proxy_pass http://ms-jobs:8004; }
    location /api/job-recommendation/ { proxy_pass http://ms-jobs:8004; }

    # ── Interviews (ms-interview :8005) ──
    location /api/employer/interviews/ {
        proxy_pass http://ms-interview:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /api/interviews/ {
        proxy_pass http://ms-interview:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Assessments (ms-assessment :8006) ──
    location /api/manual-assessment/ { proxy_pass http://ms-assessment:8006; }
    location /api/manual-section/    { proxy_pass http://ms-assessment:8006; }
    location /api/manual-question/   { proxy_pass http://ms-assessment:8006; }
    location /api/manual-assessment-config/ { proxy_pass http://ms-assessment:8006; }
    location /api/manual-paper/      { proxy_pass http://ms-assessment:8006; }
    location /api/manual-assignment/ { proxy_pass http://ms-assessment:8006; }
    location /api/manual-test/       { proxy_pass http://ms-assessment:8006; }
    location /api/manual-response/   { proxy_pass http://ms-assessment:8006; }
    location /api/manual-result/     { proxy_pass http://ms-assessment:8006; }
    location /api/manual-ai/         { proxy_pass http://ms-assessment:8006; }
    location /api/manual-code/       { proxy_pass http://ms-assessment:8006; }
    location /api/manual-coding/     { proxy_pass http://ms-assessment:8006; }
    location /api/manual-reviewer/   { proxy_pass http://ms-assessment:8006; }
    location /api/ai-assessment/     { proxy_pass http://ms-assessment:8006; }
    location /api/ai-paper/          { proxy_pass http://ms-assessment:8006; }
    location /api/proctor/           { proxy_pass http://ms-assessment:8006; }

    # ── IAEM (ms-iaem :8007) ──
    location /api/iaem/       { proxy_pass http://ms-iaem:8007; }
    location /api/compliance-officers/ { proxy_pass http://ms-iaem:8007; }

    # ── Admin (ms-admin :8008) ──
    location /api/admin/      { proxy_pass http://ms-admin:8008; }
    location /api/admin-panel/ { proxy_pass http://ms-admin:8008; }
    location /api/super-admin/ { proxy_pass http://ms-admin:8008; }
    location /api/superadmin/ { proxy_pass http://ms-admin:8008; }
    location /api/platform-admin/ { proxy_pass http://ms-admin:8008; }
    location /api/verification/ { proxy_pass http://ms-admin:8008; }
    location /api/support-ticket/ { proxy_pass http://ms-admin:8008; }
    location /api/support/    { proxy_pass http://ms-admin:8008; }
    location /api/blog/       { proxy_pass http://ms-admin:8008; }
    location /api/public/     { proxy_pass http://ms-admin:8008; }
    location /api/announcements/ { proxy_pass http://ms-admin:8008; }
    location /api/notifications/ { proxy_pass http://ms-admin:8008; }
    location /api/notification/ { proxy_pass http://ms-admin:8008; }
    location /api/newsletter/ { proxy_pass http://ms-admin:8008; }
    location /api/email/      { proxy_pass http://ms-admin:8008; }

    # ── Weekly Interview (WebSocket) ──
    location /ws/ {
        proxy_pass http://weekly-interview:8032;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /weekly_interview/ {
        proxy_pass http://weekly-interview:8032;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /api/weekly/     { proxy_pass http://weekly-interview:8032; }

    # ── Cache Vite hashed assets forever ──
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}